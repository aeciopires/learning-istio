apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookinfo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: learning-istio
    learning-istio/step: "6"
    learning-istio/mode: all
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ${MY_NAMESPACE}
  # Not a chart either: Istio publishes Bookinfo as plain manifests. Two
  # directories of the same repository, each filtered to the files day1.md
  # applies by hand.
  sources:
    - repoURL: https://github.com/istio/istio.git
      targetRevision: ${ISTIO_VERSION}
      path: samples/bookinfo/platform/kube
      directory:
        include: '{bookinfo.yaml,bookinfo-versions.yaml}'
    - repoURL: https://github.com/istio/istio.git
      targetRevision: ${ISTIO_VERSION}
      path: samples/bookinfo/gateway-api
      directory:
        include: 'bookinfo-gateway.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Enrolls the namespace in the mesh: "istio-injection: enabled" in
    # sidecar mode, "istio.io/dataplane-mode: ambient" in ambient mode.
    managedNamespaceMetadata:
      labels:
        ${BOOKINFO_NAMESPACE_LABEL_KEY}: ${BOOKINFO_NAMESPACE_LABEL_VALUE}
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-addons
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: learning-istio
    learning-istio/step: "6"
    learning-istio/mode: all
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # Grafana, Prometheus, Kiali and Jaeger from Istio's own sample manifests
  # (demo-grade, exactly what day1.md installs) - the versions track
  # ISTIO_VERSION, not the informational *_VERSION fields of versions.env.
  source:
    repoURL: https://github.com/istio/istio.git
    targetRevision: ${ISTIO_VERSION}
    path: samples/addons
    directory:
      include: '{grafana.yaml,prometheus.yaml,kiali.yaml,jaeger.yaml}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
