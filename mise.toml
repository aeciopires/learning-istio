# mise's native config format (this repo does not use the asdf-compatible
# .tool-versions format). "istio-upgrade docs update --apply" keeps these
# four pins in sync with README.md and INSTALL_REQUIREMENTS.md automatically.

[tools]
kind = "0.33.0"
helm = "3.22.1"
kubectl = "1.37.2"
istioctl = "1.32.0"
